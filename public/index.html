<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Sub4 Coach</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Sub4 Coach</h1>
    <p class="sub">静岡マラソン 2027/3/14 まで <strong id="countdown">–</strong> 日</p>
  </header>

  <main>
    <!-- ログイン -->
    <section id="login" class="card" hidden>
      <h2>ログイン</h2>
      <form id="login-form">
        <input type="password" name="password" placeholder="パスワード" autocomplete="current-password" required>
        <button type="submit">ログイン</button>
      </form>
      <p class="msg" id="login-msg"></p>
    </section>

    <!-- COROS接続 -->
    <section id="coros" class="card" hidden>
      <h2>COROS 接続</h2>
      <p id="coros-state">確認中…</p>
      <div class="row">
        <a class="btn" id="connect" href="/oauth/start">COROSと接続</a>
        <button class="ghost" id="disconnect" hidden>接続を解除</button>
      </div>
      <p class="msg" id="coros-msg"></p>
      <details id="as-details" hidden>
        <summary>認可サーバーの発見ログ</summary>
        <pre id="as-log"></pre>
      </details>
    </section>

    <!-- 取得テスト -->
    <section id="probe" class="card" hidden>
      <h2>データ取得テスト</h2>
      <p class="hint">COROSから実際に取れるデータを確認します（読み取りのみ。時計やCOROSアカウントには何も書き込みません）。</p>
      <div class="row">
        <button id="run-probe">取得テストを実行</button>
        <button class="ghost" id="download" hidden>結果をJSONで保存</button>
      </div>
      <p class="msg" id="probe-msg"></p>
      <div id="probe-result"></div>
    </section>

    <p class="footer"><button class="link" id="logout" hidden>ログアウト</button></p>
  </main>

  <script src="/app.js" type="module"></script>
</body>
</html>
