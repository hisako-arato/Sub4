<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Sub4 Coach</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- ログイン -->
  <section id="login" class="login" hidden>
    <div class="card">
      <h2>ログイン</h2>
      <form id="login-form">
        <input type="password" name="password" placeholder="パスワード" autocomplete="current-password" required>
        <button type="submit">ログイン</button>
      </form>
      <p class="msg" id="login-msg"></p>
    </div>
  </section>

  <!-- アプリ本体：スクロールしない1画面（上：状態の1行／中：コーチ／下：タブの中身／最下段：タブ） -->
  <div id="app" class="shell" hidden>
    <header class="topbar">
      <div class="tb-main">静岡まで <b id="countdown">–</b>日<span id="phase" class="phase"></span></div>
      <span id="cond" class="cond"></span>
      <button class="sync-chip" id="sync" aria-label="COROSと同期"><i id="sync-dot" class="dot"></i><span id="sync-label">同期</span></button>
    </header>

    <section class="coach">
      <canvas id="coach-canvas" aria-label="コーチ"></canvas>
      <div class="bubble" id="coach-bubble" role="button" tabindex="0">
        <span id="coach-text">コーチを呼んでいます…</span><span class="more" id="coach-more" hidden>▼</span>
      </div>
    </section>

    <main class="panels">
      <section class="panel" id="tab-coach">
        <div id="alerts"></div>
        <div class="grid2">
          <div class="card-s" id="today"></div>
          <div class="card-s" id="week"></div>
        </div>
        <div class="card-s" id="season"></div>
        <div class="card-s insights" id="insights"></div>
        <p class="msg" id="sync-msg"></p>
      </section>

      <section class="panel" id="tab-plan" hidden>
        <div class="panel-head"><span>2週間の練習</span><span class="muted" id="week-sum"></span></div>
        <ul id="days" class="rows"></ul>
      </section>

      <section class="panel" id="tab-care" hidden>
        <div class="seg" data-group="care"><button data-seg="care-list" class="on">ケア</button><button data-seg="nutrition">栄養</button></div>
        <div id="care-list"></div>
        <div id="nutrition" hidden></div>
      </section>

      <section class="panel" id="tab-log" hidden>
        <div class="seg" data-group="log"><button data-seg="past-box" class="on">最近の記録</button><button data-seg="volume">走行距離</button></div>
        <div id="past-box"><ul id="past" class="rows"></ul></div>
        <div id="volume" hidden></div>
      </section>

      <section class="panel scroll" id="tab-settings" hidden>
        <h3>COROS 接続</h3>
        <p id="coros-state">確認中…</p>
        <div class="row">
          <a class="btn small" id="connect" href="/oauth/start">COROSと接続</a>
          <button class="ghost small" id="disconnect" hidden>接続を解除</button>
        </div>
        <p class="msg" id="coros-msg"></p>
        <p class="msg" id="sync-detail"></p>

        <p class="hint">走った記録・体重などのデータは COROS を参照するだけです。変えるときは COROS アプリで。</p>

        <h3>達成の判定</h3>
        <form id="settings-form" class="settings">
          <label>距離 <input type="number" id="set-dist" min="50" max="100" step="1"> % 以上</label>
          <label>ペース 目安 ± <input type="number" id="set-pace" min="0" max="60" step="1"> 秒/km 以内</label>
          <button type="submit" class="small">保存</button>
          <span class="msg" id="settings-msg"></span>
        </form>

        <details>
          <summary><h3 class="inline">走力とペースの基準</h3></summary>
          <div id="ability"></div>
        </details>

        <details>
          <summary><h3 class="inline">データ取得テスト</h3></summary>
          <p class="hint">COROSから実際に取れるデータを確認します（読み取りのみ）。</p>
          <div class="row">
            <button class="small" id="run-probe">取得テストを実行</button>
            <button class="ghost small" id="download" hidden>結果をJSONで保存</button>
          </div>
          <p class="msg" id="probe-msg"></p>
          <div id="probe-result"></div>
          <details id="as-details" hidden>
            <summary>認可サーバーの発見ログ</summary>
            <pre id="as-log"></pre>
          </details>
        </details>

        <p class="footer"><button class="link" id="logout">ログアウト</button></p>
      </section>
    </main>

    <nav class="tabbar">
      <button data-tab="coach" class="on"><span>💬</span>コーチ</button>
      <button data-tab="plan"><span>📅</span>2週間</button>
      <button data-tab="care"><span>🧘</span>ケア</button>
      <button data-tab="log"><span>📈</span>記録</button>
      <button data-tab="settings"><span>⚙️</span>設定</button>
    </nav>

    <!-- 詳細を下から出すシート -->
    <div class="sheet-bg" id="sheet-bg" hidden></div>
    <section class="sheet" id="sheet" hidden aria-modal="true" role="dialog">
      <button class="sheet-close" id="sheet-close" aria-label="閉じる">✕</button>
      <div id="sheet-body"></div>
    </section>
  </div>

  <script src="/app.js" type="module"></script>
</body>
</html>
