name = "sub4-coach"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# 管理画面で登録した変数を、GitHub からの再デプロイで消さない
keep_vars = true

# 画面（HTML/JS/CSS）は public/ から配信。API・OAuth だけ Worker を通す。
[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/oauth/*"]

[[d1_databases]]
binding = "DB"
database_name = "sub4"
database_id = "f36c2cfb-cdd0-4d3d-bb03-981baa9d5662"
# テーブルは Worker が初回アクセス時に自動作成する（src/schema.ts）

# 毎朝 5:00 JST（= 20:00 UTC）にトークン更新（後の段階でデータ同期もここで行う）
[triggers]
crons = ["0 20 * * *"]

[vars]
COROS_MCP_URL = "https://mcp.coros.com/mcp"

# 秘密情報は wrangler secret で登録（README参照）
#   APP_PASSWORD   … アプリのログインパスワード（必須）
#   SESSION_SECRET … セッション署名鍵（任意。未設定なら自動生成してDBに保存）
#   COROS_CLIENT_ID / COROS_CLIENT_SECRET … COROS が動的クライアント登録に非対応だった場合のみ
